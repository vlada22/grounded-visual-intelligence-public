name: Copy exact original Article 01 demo

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/mirror-original-demo.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout public repository
        uses: actions/checkout@v6

      - name: Clone original repository
        run: git clone --depth 1 https://github.com/vlada22/grounded-visual-intelligence.git /tmp/original

      - name: Copy exact published demo files
        run: |
          rm -rf web demo assets/article-01
          cp -a /tmp/original/web ./web
          mkdir -p assets/article-01
          cp -a /tmp/original/assets/article-01/sample.mp4 ./assets/article-01/sample.mp4

      - name: Commit exact copy
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A web demo assets/article-01
          if git diff --cached --quiet; then
            echo "Article 01 demo already matches the original exactly."
            exit 0
          fi
          git commit -m "Copy exact original Article 01 demo"
          git push
